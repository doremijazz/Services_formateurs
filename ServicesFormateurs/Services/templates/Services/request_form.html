{% extends "Services/base.html" %}

{% block main %}

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}
    {{ date_form.management_form }}

    <div class="crenaux_demande">
        {% for slot in date_form %}
            <fieldset class="un_crenau_demande">
                <legend>Créneau {{ forloop.counter }}</legend>

                {{ slot.as_p }}
            </fieldset>
        {% endfor %}
    </div>
    <div class="enregistrer_demande">
    <button type="submit" class="enregistrer">
        Enregistrer
    </button>
        </div>
</form>

{% endblock %}
